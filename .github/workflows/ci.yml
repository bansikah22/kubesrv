name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate static files
        run: |
          chmod +x scripts/embed-static.sh
          ./scripts/embed-static.sh

      - name: Build binary
        run: |
          gcc -Os -static -I src -o kubesrv src/main.c src/server.c src/http.c
          ls -lh kubesrv

      - name: Test binary
        run: |
          PORT=8080 ./kubesrv &
          SERVER_PID=$!
          sleep 2
          curl -f http://localhost:8080/healthz || exit 1
          curl -f http://localhost:8080/info || exit 1
          kill $SERVER_PID

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kubesrv:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
