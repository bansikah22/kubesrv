name: Helm CD

on:
  push:
    branches: [ master ]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-cd.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'charts/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: helm lint charts/kubesrv

      - name: Template Validation (Default)
        run: helm template kubesrv charts/kubesrv --debug

      - name: Template Validation (CI Values)
        run: helm template kubesrv charts/kubesrv -f charts/kubesrv/ci/test-values.yaml --debug

      - name: Security Scan with kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: charts/kubesrv

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.14.0

      - name: Deploy to KinD
        run: |
          helm install kubesrv-preview charts/kubesrv \
            --set image.tag=latest \
            --wait \
            --timeout 5m

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc kubesrv-preview-kubesrv

      - name: Run Helm Tests
        run: helm test kubesrv-preview

