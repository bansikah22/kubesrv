{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubesrv.fullname" . }}
  labels:
    {{- include "kubesrv.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubesrv.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {} # Allow traffic from all pods in the same namespace (can be restricted further)
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
