apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kubesrv.fullname" . }}-test-connection"
  labels:
    {{- include "kubesrv.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      args: ['{{ include "kubesrv.fullname" . }}:{{ .Values.service.port }}/healthz']
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
  restartPolicy: Never
