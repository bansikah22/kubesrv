apiVersion: v1
kind: Pod
metadata:
  name: kubesrv
  namespace: kubesrv-ns
  labels:
    app: kubesrv
spec:
  containers:
    - name: kubesrv
      image: bansikah/kubesrv:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          protocol: TCP
          name: http
      env:
        - name: PORT
          value: "80"
        - name: MESSAGE
          value: "Hello, Kubernetes!"
      resources:
        requests:
          memory: "8Mi"
          cpu: "10m"
        limits:
          memory: "32Mi"
          cpu: "100m"
      livenessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz
          port: 80
        initialDelaySeconds: 1
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
  restartPolicy: Always
